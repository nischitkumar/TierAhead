[project]
name = "tiermoe"
version = "0.1.0"
description = "Router-guided memory tiering for cost-efficient MoE inference on HBM + CXL memory systems"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "zstandard>=0.21",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Needed only for the trainable predictor (policy.predictor_mlp) and lookahead
# depth experiments. CPU/MPS wheel on macOS, CUDA wheel on Linux GPU boxes --
# `pip install tiermoe[predictor]` picks whatever `pip install torch` resolves
# to on the host, same as experiments/e4_predictor and e5_lookahead already do.
predictor = ["torch>=2.1"]
# Needed only for `tiermoe dashboard`.
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
# Needed only for real GPU trace collection / calibration (collect, calibrate.*
# GPU submodules). CUDA-only -- see tiermoe.hw for the capability probe that
# gates these at runtime.
gpu = ["torch>=2.1", "transformers>=4.42,<4.47", "accelerate", "bitsandbytes", "datasets", "huggingface_hub<1.0", "sentencepiece"]
# Parquet output for large sweep tables (optional; CSV fallback always works).
parquet = ["pyarrow>=14.0"]
dev = ["pytest>=7.4", "pytest-cov"]
all = ["tiermoe[predictor,dashboard,parquet,dev]"]

[project.scripts]
tiermoe = "tiermoe.cli:main"

[tool.setuptools.packages.find]
include = ["tiermoe*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
